name: Deploy Vite Vue site

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# 官方 Pages 部署需要的权限（用 OIDC，不需要仓库写权限）
permissions:
  contents: read
  pages: write
  id-token: write

# 同时只允许一个部署任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Vite 8 / @vitejs/plugin-vue 6 要求 Node ^20.19.0 || >=22.12.0
          node-version: 22
          cache: 'npm'
          cache-dependency-path: second/package-lock.json

      - name: Install dependencies
        working-directory: ./second
        run: npm install

      - name: Build
        working-directory: ./second
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./second/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4